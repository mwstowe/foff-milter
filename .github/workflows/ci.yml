name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.95.0
      with:
        components: rustfmt, clippy
    
    - name: Install Tesseract for OCR support
      timeout-minutes: 30
      run: |
        # Runners intermittently fail to resolve the Ubuntu mirrors. apt-get update only
        # warns on fetch failures, so retry the whole update+install until install succeeds.
        for attempt in 1 2 3 4 5; do
          if sudo apt-get -o Acquire::Retries=3 update \
             && sudo apt-get -o Acquire::Retries=3 install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev; then
            exit 0
          fi
          echo "::warning::Tesseract install attempt $attempt failed; retrying in $((attempt * 30))s"
          sleep $((attempt * 30))
        done
        echo "::error::Tesseract install failed after 5 attempts"
        exit 1
    
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.tesseract-rs
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy (with OCR features)
      run: cargo clippy --all-targets --features ocr -- -D warnings
    
    - name: Run unit tests (with OCR features)
      run: cargo test --verbose --features ocr
    
    - name: Build release (with OCR support)
      run: cargo build --release --features ocr --verbose

  email-tests:
    name: Email Detection Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.95.0
    
    - name: Install Tesseract for OCR support
      timeout-minutes: 30
      run: |
        # Runners intermittently fail to resolve the Ubuntu mirrors. apt-get update only
        # warns on fetch failures, so retry the whole update+install until install succeeds.
        for attempt in 1 2 3 4 5; do
          if sudo apt-get -o Acquire::Retries=3 update \
             && sudo apt-get -o Acquire::Retries=3 install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev; then
            exit 0
          fi
          echo "::warning::Tesseract install attempt $attempt failed; retrying in $((attempt * 30))s"
          sleep $((attempt * 30))
        done
        echo "::error::Tesseract install failed after 5 attempts"
        exit 1
    
    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.tesseract-rs
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build release binary (with OCR support)
      run: cargo build --release --features ocr
    
    - name: Run email test suite
      run: |
        echo "🧪 Running comprehensive email detection tests..."
        ./tests/run_tests.sh
        
    - name: Test configuration validation
      run: |
        echo "🔧 Testing configuration validation..."
        ./target/release/foff-milter --test-config -c foff-milter-ci.toml
        
    - name: Generate test report
      run: |
        echo "📊 Email Detection Test Results" >> $GITHUB_STEP_SUMMARY
        echo "================================" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count test files
        POSITIVE_COUNT=$(find tests/positive -name "*.eml" | wc -l)
        NEGATIVE_COUNT=$(find tests/negative -name "*.eml" | wc -l)
        TOTAL_COUNT=$((POSITIVE_COUNT + NEGATIVE_COUNT))
        
        echo "📈 **Test Coverage:**" >> $GITHUB_STEP_SUMMARY
        echo "- Spam Detection Tests: $POSITIVE_COUNT emails" >> $GITHUB_STEP_SUMMARY
        echo "- False Positive Tests: $NEGATIVE_COUNT emails" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Test Cases: $TOTAL_COUNT emails**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run tests and capture results
        if ./tests/run_tests.sh > test_results.log 2>&1; then
          SUCCESS_RATE=$(tail -5 test_results.log | grep "Success Rate" | cut -d: -f2 | tr -d ' ')
          echo "✅ **All tests passed!** Success Rate: $SUCCESS_RATE" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some tests failed.** Check logs for details." >> $GITHUB_STEP_SUMMARY
        fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.95.0
    
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    
    - name: Run security audit
      run: cargo audit
